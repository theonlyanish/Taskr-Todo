<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found: Taskr</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#3d7199" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">

    <script>
      // Match the theme picked in the app (same storage key), else the device's
      try {
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || savedTheme === 'light') {
          document.documentElement.setAttribute('data-theme', savedTheme);
        }
      } catch (e) {}
    </script>
    <style>
      body {
        margin: 0;
        background: #fff;
        color: #1a1a1f;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        line-height: 1.6;
      }
      main { max-width: 720px; margin: 0 auto; padding: 2rem 1rem 3rem; }
      h1 { font-size: 2rem; margin: 0 0 0.5rem; line-height: 1.2; }
      p { margin-bottom: 0.5rem; }
      a { color: #3d7199; }
      .cta { display: inline-block; margin: 0.5rem 0 1rem; padding: 0.6rem 1.1rem; background: #3d7199; color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; }
      .meta { color: #6b6f78; font-size: 0.9rem; }
    </style>
    <!-- Light and dark colours, after the styles above so they win -->
    <link rel="stylesheet" href="/page-theme.css" />
  </head>
  <body>
    <main>
      <p class="meta"><a href="https://taskr-todo.vercel.app/">Taskr</a> &rsaquo; 404</p>
      <h1>That page does not exist</h1>
      <a class="cta" href="https://taskr-todo.vercel.app/">Open Taskr</a>
    </main>
  </body>
</html>
