# Keeps the free-tier Supabase project awake.
#
# Supabase pauses free-tier projects after roughly a week without API
# activity, which breaks sign-in and cloud sync for every visitor until the
# owner restores the project by hand. One tiny read every few days is enough
# to count as activity. The job fails on any non-2xx response, so a paused
# project shows up as a red run in the Actions tab.
#
# Requires two repository secrets (see README.md, "Keeping Supabase awake"):
#   SUPABASE_URL       - the project URL, e.g. https://xxxx.supabase.co
#   SUPABASE_ANON_KEY  - the project's anon (public) key

name: Supabase keep-alive

on:
  schedule:
    # 03:17 UTC every 3 days (day-of-month step, so it also runs on the 1st).
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping the tasks table
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /rest/v1/tasks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Repository secrets SUPABASE_URL and SUPABASE_ANON_KEY must both be set."
            exit 1
          fi

          # Strip a trailing slash so the path below is well-formed either way.
          base="${SUPABASE_URL%/}"

          status=$(curl --silent --show-error --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            "$base/rest/v1/tasks?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY") || true

          echo "Supabase responded with HTTP ${status:-000}"

          case "$status" in
            2*) echo "Project is awake." ;;
            *)
              echo "::error::Expected a 2xx response but got '${status:-000}'. The Supabase project may be paused - restore it from the Supabase dashboard."
              exit 1
              ;;
          esac
